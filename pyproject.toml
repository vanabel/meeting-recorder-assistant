[project]
name = "meeting-recorder-assistant"
version = "0.1.0"
description = "Windows Tencent Meeting recorder automation MVP."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]

[project.scripts]
meeting-recorder = "meeting_recorder_assistant.cli:main"
meeting-recorder-gui = "meeting_recorder_assistant.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_recorder_assistant"]
